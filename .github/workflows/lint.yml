name: lint

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: editorconfig-checker/action-editorconfig-checker@v3.0.0
      - name: editorconfig
        run: editorconfig-checker --exclude 'docs/public/imgit/|\.meta$|\.anim$|\.dds$|\.controller$|\.asset$|\.unity$|\.asmdef$|ProjectSettings'
