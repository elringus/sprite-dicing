name: test unity plugin

on:
  workflow_dispatch:
  pull_request_target:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write # test results check run
  id-token: write # codecov upload via oidc

jobs:

  cover:
    name: test and cover
    runs-on: ubuntu-latest
    # PRs from forks run with the repo secrets, so they're gated behind an environment with required reviewers.
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'external-pr' || '' }}
    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - uses: actions/cache@v6
        with:
          path: plugins/unity/Library
          key: Library-${{ hashFiles('plugins/unity/Assets/**', 'plugins/unity/Packages/**', 'plugins/unity/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run tests and generate coverage report
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: plugins/unity
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          testMode: editmode
          coverageOptions: useProjectSettings;generateAdditionalMetrics
          customParameters: -debugCodeOptimization -enableCodeCoverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ${{ steps.tests.outputs.coveragePath }}/**/*.xml
          fail_ci_if_error: true
