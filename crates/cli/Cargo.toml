[package]
name = "dicing"
version = "1.0.0"
edition = "2024"
description = "Tool for lossless compression of sprite textures with identical areas."
license = "MIT"
authors = ["Artyom Sovetnikov (Elringus)"]
homepage = "https://dicing.elringus.com"
documentation = "https://dicing.elringus.com/guide/cli"
repository = "https://github.com/elringus/sprite-dicing"
readme = "../../README.md"
keywords = ["gamedev", "graphics", "sprite", "texture", "atlas"]
categories = ["command-line-utilities", "game-development", "graphics"]

[dependencies]
sprite_dicing = { path = "../lib", version = "1.0.0" }
image = { version = "0.25", default-features = false, features = [
    "rayon",
    "png",
    "webp",
    "tga",
    "dds",
    "tiff",
    "jpeg",
    "bmp"
] }
rayon = "1.12"
clap = { version = "4.6", features = ["derive"] }
indicatif = "0.18"
